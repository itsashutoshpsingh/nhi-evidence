[project]
name = "nhi-evidence"
version = "0.1.0"
description = "Read-only evidence of risky non-human identities in Microsoft Entra ID, mapped to the OWASP NHI Top 10"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ashutosh Pal Singh" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
    "msal==1.39.0",
    "networkx==3.7",
]

[project.optional-dependencies]
charts = ["matplotlib==3.11.2", "numpy==2.5.4"]

[project.scripts]
nhi-evidence = "nhi_evidence.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5", "matplotlib==3.11.2", "numpy==2.5.4"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhi_evidence"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
